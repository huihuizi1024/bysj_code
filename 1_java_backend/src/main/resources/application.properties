# 加载外部敏感配置（不存在也不报错）
spring.config.import=optional:file:./secrets.properties

spring.application.name=ai_app_java
#============================================
#                数据库配置
#============================================
# 数据库URL，端口3306，数据库名mental_health_db
spring.datasource.url=jdbc:mysql://localhost:3306/mental_health_db?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
# 数据库用户名
spring.datasource.username=root
# 密码从 secrets.properties 读取，不再硬编码
spring.datasource.password=${spring.datasource.password:}
#数据库驱动
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#============================================
#              MyBatis-Plus 配置
#============================================
# 开启SQL日志输出（开发环境用，上线后关闭）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 类型别名包扫描
mybatis-plus.type-aliases-package=com.example.ai_app_java.entity
#============================================
#              JWT 配置
#============================================
# 从 secrets.properties 读取
jwt.secret=${jwt.secret:}
jwt.expiration=86400000

#============================================
#           AI 大模型多提供商配置
#============================================
# DeepSeek
ai.deepseek.url=https://api.deepseek.com/v1/chat/completions
ai.deepseek.key=${ai.deepseek.key:}
ai.deepseek.model=deepseek-chat

# OpenAI（可按需启用）
ai.openai.url=https://api.openai.com/v1/chat/completions
ai.openai.key=${ai.openai.key:}
ai.openai.model=gpt-4o-mini

# Kimi（可按需启用）
ai.kimi.url=https://api.moonshot.cn/v1/chat/completions
ai.kimi.key=${ai.kimi.key:}
ai.kimi.model=moonshot-v1-8k

# 本地模型（可按需启用）
ai.local.url=http://localhost:8000/v1/chat/completions
ai.local.key=${ai.local.key:}
ai.local.model=your-local-model